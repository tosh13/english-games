<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Crossword</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#2b2b2e;
  --cell:#ffffff; --hl:#dbe9ff; --cur:#ffd84d; --wrong:#ffd6d6; --wrong-ink:#c0262d;
  --ok:#1f8a4c; --rev:#2a6fdb; --accent:#2a6fdb; --btn:#e9e7e1; --btn-ink:#1d1d1f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18181b; --panel:#232327; --ink:#ececf0; --muted:#a0a0a8; --line:#c9c9cf;
    --cell:#2c2c31; --hl:#2d4366; --cur:#80691a; --wrong:#5a2326; --wrong-ink:#ff8a8f;
    --ok:#5fd394; --rev:#8db8ff; --accent:#8db8ff; --btn:#34343a; --btn-ink:#ececf0;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}
.theme{font-size:1rem;color:var(--muted);margin:0 0 12px}
.theme b{color:var(--ink);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.controls label{font-size:.9rem;color:var(--muted)}
select,button{font:inherit;font-size:.95rem;border-radius:8px;border:1px solid transparent;
  padding:7px 12px;background:var(--btn);color:var(--btn-ink);cursor:pointer}
select{border-color:var(--line)}
button.primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#111}}
button:disabled{opacity:.45;cursor:default}
.layout{display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:24px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.boardcol{min-width:0}
.cluebar{position:sticky;top:0;z-index:2;background:var(--panel);border-radius:10px;
  padding:10px 12px;margin-bottom:10px;min-height:3.4em;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cluebar .tag{font-weight:700;margin-right:6px}
.cluebar .ja{color:var(--muted)}
.board{display:grid;gap:0;padding:2px;width:max-content;margin:0 auto}
.sq{width:var(--cs);height:var(--cs);position:relative}
.cell{background:var(--cell);box-shadow:0 0 0 1px var(--line)}
.cell.hl{background:var(--hl)}
.cell.cur{background:var(--cur)}
.cell.wrong{background:var(--wrong)}
.cell.wrong input{color:var(--wrong-ink)}
.cell.revealed input{color:var(--rev)}
.cell .num{position:absolute;top:1px;left:2px;font-size:max(8px,calc(var(--cs)*.27));
  line-height:1;color:var(--muted);pointer-events:none}
.cell input{width:100%;height:100%;border:0;margin:0;padding:0;background:transparent;
  color:var(--ink);text-align:center;text-transform:uppercase;font-weight:600;
  font-size:max(16px,calc(var(--cs)*.55));caret-color:transparent;outline:none;
  border-radius:0;-webkit-appearance:none;appearance:none;padding-top:calc(var(--cs)*.1)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.status{text-align:center;min-height:1.6em;margin-top:10px;font-weight:600}
.status.ok{color:var(--ok)} .status.ng{color:var(--wrong-ink)}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.clues{grid-template-columns:1fr}}
.clues h2{font-size:1rem;margin:0 0 6px;border-bottom:2px solid var(--line);padding-bottom:2px}
.clue{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.95rem}
.clue:hover{background:var(--btn)}
.clue.active{background:var(--hl)}
.clue.done .en{color:var(--muted);text-decoration:line-through}
.clue .n{font-weight:700;display:inline-block;min-width:1.8em}
.clue .ja{display:block;color:var(--muted);font-size:.88rem;padding-left:1.8em}
.cluepanel{background:var(--panel);border-radius:10px;padding:12px;max-height:calc(100vh - 140px);overflow:auto}
@media (max-width:860px){.cluepanel{max-height:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>English Crossword</h1>
  <p class="theme" id="theme"></p>
  <div class="controls">
    <label for="topic">お題</label>
    <select id="topic"></select>
    <button class="primary" id="newBtn">新しい問題</button>
  </div>
  <div class="layout">
    <div class="boardcol">
      <div class="cluebar" id="cluebar"></div>
      <div class="board" id="board"></div>
      <div class="actions">
        <button id="checkBtn">答え合わせ</button>
        <button id="letterBtn">1文字見る</button>
        <button id="allBtn">全部の答えを見る</button>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="cluepanel">
      <div class="clues">
        <div><h2>Across（ヨコ）</h2><div id="acrossList"></div></div>
        <div><h2>Down（タテ）</h2><div id="downList"></div></div>
      </div>
    </div>
  </div>
</div>

const SIZE = 13, TARGET = 14, ATTEMPTS = 40;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// 置けるなら交差数（1以上）、置けないなら -1
function canPlace(g,w,r0,c0,dir){
  const dr=dir==="D"?1:0, dc=dir==="A"?1:0, L=w.length;
  const r1=r0+dr*(L-1), c1=c0+dc*(L-1);
  if(r0<0||c0<0||r1>=SIZE||c1>=SIZE) return -1;
  const at=(r,c)=>(r>=0&&c>=0&&r<SIZE&&c<SIZE)?g[r][c]:null;
  if(at(r0-dr,c0-dc)||at(r1+dr,c1+dc)) return -1;
  let x=0;
  for(let i=0;i<L;i++){
    const r=r0+dr*i,c=c0+dc*i,cell=g[r][c];
    if(cell){ if(cell.ch!==w[i]||cell[dir]) return -1; x++; }
    else if(at(r+dc,c+dr)||at(r-dc,c-dr)) return -1;
  }
  return x===L?-1:x;
}
function put(g,w,r0,c0,dir){
  const dr=dir==="D"?1:0, dc=dir==="A"?1:0;
  for(let i=0;i<w.length;i++){
    const r=r0+dr*i,c=c0+dc*i;
    if(!g[r][c]) g[r][c]={ch:w[i],A:false,D:false};
    g[r][c][dir]=true;
  }
}

function generate(words,seed){
  const rnd=mulberry32(seed);
  const usable=words.filter(e=>e[0].length<=SIZE);
  let best=null;
  for(let t=0;t<ATTEMPTS;t++){
    const pool=shuffle(usable,rnd);
    const g=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
    let fi=0; for(let i=1;i<Math.min(6,pool.length);i++) if(pool[i][0].length>pool[fi][0].length) fi=i;
    const first=pool.splice(fi,1)[0];
    const fd=rnd()<0.5?"A":"D", mid=Math.floor(SIZE/2), off=Math.floor((SIZE-first[0].length)/2);
    const fr=fd==="A"?mid:off, fc=fd==="A"?off:mid;
    put(g,first[0],fr,fc,fd);
    const placed=[{e:first,r:fr,c:fc,dir:fd}];
    let cross=0, nA=fd==="A"?1:0, nD=1-nA;
    for(let pass=0;pass<3&&placed.length<TARGET;pass++){
      for(let i=0;i<pool.length&&placed.length<TARGET;i++){
        const e=pool[i]; if(!e) continue;
        let cands=[],bx=0;
        for(const dir of ["A","D"]) for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
          let x=canPlace(g,e[0],r,c,dir); if(x<1) continue;
          // タテとヨコの数が偏らないよう、少ない方を少し優先する
          const s=x*2+((dir==="A"?nA<nD:nD<nA)?1:0);
          if(s>bx){bx=s;cands=[];} if(s===bx) cands.push([r,c,dir,x]);
        }
        if(!cands.length) continue;
        const [r,c,dir,x]=cands[Math.floor(rnd()*cands.length)];
        put(g,e[0],r,c,dir); placed.push({e,r,c,dir}); cross+=x; pool[i]=null;
        if(dir==="A") nA++; else nD++;
      }
    }
    const score=placed.length*100+cross*10-Math.abs(nA-nD)*5;
    if(!best||score>best.score) best={score,placed};
  }
  return best.placed;
}

// 生成結果を盤（13×13固定）と番号付きのカギに組み立てる
function build(placed){
  const sol=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  for(const p of placed){
    const dr=p.dir==="D"?1:0, dc=p.dir==="A"?1:0;
    for(let i=0;i<p.e[0].length;i++) sol[p.r+dr*i][p.c+dc*i]=p.e[0][i];
  }
  // 盤の中央に寄せる
  let minR=SIZE,maxR=-1,minC=SIZE,maxC=-1;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(sol[r][c]){minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c);}
  const sr=Math.floor((SIZE-(maxR-minR+1))/2)-minR, sc=Math.floor((SIZE-(maxC-minC+1))/2)-minC;
  const grid=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(sol[r][c]) grid[r+sr][c+sc]=sol[r][c];
  const starts={};
  for(const p of placed){ const k=(p.r+sr)+","+(p.c+sc); (starts[k]=starts[k]||[]).push(p); }
  const nums={}; let n=0; const entries=[];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const k=r+","+c; if(!starts[k]) continue;
    nums[k]=++n;
    for(const p of starts[k]){
      const dr=p.dir==="D"?1:0, dc=p.dir==="A"?1:0, cells=[];
      for(let i=0;i<p.e[0].length;i++) cells.push([r+dr*i,c+dc*i]);
      entries.push({num:n,dir:p.dir,answer:p.e[0],en:p.e[1],ja:p.e[2],cells});
    }
  }
  return {grid,nums,entries};
}
</script>

  finished=false;

  $("theme").innerHTML=`お題：<b>${topic.en}</b>（${topic.ja}）・${puz.entries.length}語`;
  render(); status("");
  const first=puz.entries.find(e=>e.dir==="A")||puz.entries[0];
  dir=first.dir; cur=first.cells[0]; refresh();
  cellEls[cur[0]+","+cur[1]].querySelector("input").focus({preventScroll:true});
  checkComplete(true);
}
const key=()=>"xw13:"+topic.id+":"+seed;
const sig=()=>puz.entries.map(e=>e.answer).join(",");
const save=()=>store.set(key(),{sig:sig(),letters,revealed});

function cellSize(){
  const w=Math.min(document.querySelector(".boardcol").clientWidth||600,560);
  return Math.max(22,Math.min(40,Math.floor((w-6)/SIZE)));
}
function render(){
  const b=$("board");
  b.style.setProperty("--cs",cellSize()+"px");
  b.style.gridTemplateColumns=`repeat(${SIZE},var(--cs))`;
  b.innerHTML=""; cellEls={};
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const d=document.createElement("div");
    if(!puz.grid[r][c]){d.className="sq";b.appendChild(d);continue;}
    d.className="sq cell"+(revealed[r][c]?" revealed":"");
    const k=r+","+c;
    if(puz.nums[k]){const s=document.createElement("span");s.className="num";s.textContent=puz.nums[k];d.appendChild(s);}
    const inp=document.createElement("input");
    inp.setAttribute("maxlength","2"); inp.setAttribute("autocomplete","off");
    inp.setAttribute("autocorrect","off"); inp.setAttribute("autocapitalize","characters");
    inp.setAttribute("spellcheck","false"); inp.setAttribute("aria-label",`row ${r+1} column ${c+1}`);
    inp.value=letters[r][c];
    let wasCur=false;
    inp.addEventListener("pointerdown",()=>{wasCur=cur&&cur[0]===r&&cur[1]===c;});
    inp.addEventListener("click",()=>{if(wasCur) toggleDir();});
    inp.addEventListener("focus",()=>select(r,c));
    inp.addEventListener("keydown",ev=>onKey(ev,r,c));
    inp.addEventListener("input",()=>{
      const v=inp.value.replace(/[^a-zA-Z]/g,"");
      const ch=v.slice(-1).toUpperCase();
      setLetter(r,c,ch);
      if(ch) advance(r,c);
    });
    d.appendChild(inp); b.appendChild(d); cellEls[k]=d;
  }
  // カギの一覧
  clueEls={};
  for(const [D,listId] of [["A","acrossList"],["D","downList"]]){
    const box=$(listId); box.innerHTML="";
    for(const e of puz.entries.filter(x=>x.dir===D).sort((a,b)=>a.num-b.num)){
      const el=document.createElement("div"); el.className="clue";
      el.innerHTML=`<span class="n">${e.num}</span><span class="en">${esc(e.en)} (${e.answer.length})</span><span class="ja">${esc(e.ja)}</span>`;
      el.addEventListener("click",()=>focusEntry(e));
      box.appendChild(el); clueEls[e.num+D]=el;
    }
  }
  updateDone();
}
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

const entryAt=(r,c,D)=>puz.entries.find(e=>e.dir===D&&e.cells.some(([a,b])=>a===r&&b===c));
function select(r,c){
  if(!(cur&&cur[0]===r&&cur[1]===c)){
    cur=[r,c];
    if(!entryAt(r,c,dir)) dir=dir==="A"?"D":"A";
  }
  refresh();
}
function toggleDir(){
  if(!cur) return;
  const o=dir==="A"?"D":"A";
  if(entryAt(cur[0],cur[1],o)){dir=o;refresh();}
}
function focusCell(r,c){
  const el=cellEls[r+","+c]; if(!el) return;
  cur=[r,c]; if(!entryAt(r,c,dir)) dir=dir==="A"?"D":"A";
  el.querySelector("input").focus({preventScroll:false}); refresh();
}
function focusEntry(e){
  dir=e.dir;
  const empty=e.cells.find(([r,c])=>!letters[r][c])||e.cells[0];
  cur=empty; cellEls[empty[0]+","+empty[1]].querySelector("input").focus(); refresh();
}
function refresh(){
  for(const k in cellEls) cellEls[k].classList.remove("hl","cur");
  for(const k in clueEls) clueEls[k].classList.remove("active");
  if(!cur) return;
  const e=entryAt(cur[0],cur[1],dir);
  if(e){
    e.cells.forEach(([r,c])=>cellEls[r+","+c].classList.add("hl"));
    const ce=clueEls[e.num+e.dir]; ce.classList.add("active");
    const panel=document.querySelector(".cluepanel");
    if(panel.scrollHeight>panel.clientHeight){
      const top=ce.offsetTop-panel.offsetTop;
      if(top<panel.scrollTop||top>panel.scrollTop+panel.clientHeight-ce.offsetHeight) panel.scrollTop=top-40;
    }
    $("cluebar").innerHTML=`<span class="tag">${e.num} ${e.dir==="A"?"Across":"Down"}</span>${esc(e.en)} (${e.answer.length})<br><span class="ja">${esc(e.ja)}</span>`;
  }
  cellEls[cur[0]+","+cur[1]].classList.add("cur");
}
function step(r,c,d){
  const e=entryAt(r,c,dir); if(!e) return null;
  const i=e.cells.findIndex(([a,b])=>a===r&&b===c);
  return e.cells[i+d]||null;
}
function advance(r,c){const n=step(r,c,1); if(n) focusCell(n[0],n[1]);}
function nextEntry(d){
  const list=puz.entries.slice().sort((a,b)=>(a.dir===b.dir?a.num-b.num:a.dir==="A"?-1:1));
  const e=entryAt(cur[0],cur[1],dir);
  const i=list.indexOf(e);
  focusEntry(list[(i+d+list.length)%list.length]);
}
function moveArrow(r,c,dr,dc){
  const axis=dc?"A":"D";
  if(axis!==dir&&entryAt(r,c,axis)){dir=axis;refresh();return;}
  let rr=r+dr,cc=c+dc;
  while(rr>=0&&cc>=0&&rr<SIZE&&cc<SIZE){ if(puz.grid[rr][cc]){focusCell(rr,cc);return;} rr+=dr;cc+=dc; }
}
function onKey(ev,r,c){
  if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
  const k=ev.key;
  if(/^[a-zA-Z]$/.test(k)){ev.preventDefault();setLetter(r,c,k.toUpperCase());advance(r,c);return;}
  switch(k){
    case "Backspace":
      ev.preventDefault();
      if(letters[r][c]&&!revealed[r][c]) setLetter(r,c,"");
      else { const p=step(r,c,-1); if(p){ setLetter(p[0],p[1],""); focusCell(p[0],p[1]); } }
      break;
    case "Delete": ev.preventDefault(); setLetter(r,c,""); break;
    case "ArrowLeft": ev.preventDefault(); moveArrow(r,c,0,-1); break;
    case "ArrowRight": ev.preventDefault(); moveArrow(r,c,0,1); break;
    case "ArrowUp": ev.preventDefault(); moveArrow(r,c,-1,0); break;
    case "ArrowDown": ev.preventDefault(); moveArrow(r,c,1,0); break;
    case " ": ev.preventDefault(); toggleDir(); break;
    case "Tab": ev.preventDefault(); nextEntry(ev.shiftKey?-1:1); break;
    case "Enter": ev.preventDefault(); nextEntry(1); break;
  }
}
function setLetter(r,c,ch){
  const el=cellEls[r+","+c];
  if(revealed[r][c]){el.querySelector("input").value=letters[r][c];return;}
  letters[r][c]=ch; el.querySelector("input").value=ch; el.classList.remove("wrong");
  save(); updateDone(); checkComplete(false);
}
function updateDone(){
  for(const e of puz.entries){
    // 正誤は答え合わせまで明かさず、全マスが埋まったカギだけを薄くする
    clueEls[e.num+e.dir].classList.toggle("done",e.cells.every(([r,c])=>letters[r][c]));
  }
}
function status(msg,cls){const s=$("status");s.textContent=msg;s.className="status"+(cls?" "+cls:"");}
function allCells(){const a=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(puz.grid[r][c])a.push([r,c]);return a;}
function checkComplete(silent){
  const cells=allCells();
  if(cells.some(([r,c])=>!letters[r][c])) {finished=false;return;}
  const wrong=cells.filter(([r,c])=>letters[r][c]!==puz.grid[r][c]).length;
  if(wrong===0){
    finished=true; updateDone();
    const used=cells.filter(([r,c])=>revealed[r][c]).length;
    status(used?`完成！（答えを見たマス：${used}）`:"完成！ 全問正解です",used?"":"ok");
  } else if(!silent) status("全部埋まりましたが、まだ違うところがあります。「答え合わせ」で確かめましょう","ng");
}

$("checkBtn").addEventListener("click",()=>{
  let wrong=0,blank=0;
  for(const [r,c] of allCells()){
    const el=cellEls[r+","+c];
    if(!letters[r][c]){blank++;continue;}
    const ng=letters[r][c]!==puz.grid[r][c]; el.classList.toggle("wrong",ng); if(ng) wrong++;
  }
  if(wrong) status(`違う文字が ${wrong} 個あります（赤いマス）`+(blank?`。空きは ${blank} マス`:""),"ng");
  else if(blank) status(`今のところ全部正しいです。残り ${blank} マス`,"ok");
  else checkComplete(false);
});
$("letterBtn").addEventListener("click",()=>{
  if(!cur) return;
  const [r,c]=cur;
  revealed[r][c]=true; letters[r][c]=puz.grid[r][c];
  const el=cellEls[r+","+c]; el.classList.add("revealed"); el.classList.remove("wrong");
  el.querySelector("input").value=letters[r][c];
  save(); updateDone(); checkComplete(false); advance(r,c);
});
$("allBtn").addEventListener("click",()=>{
  if(!confirm("全部の答えを表示します。よろしいですか？")) return;
  for(const [r,c] of allCells()){
    if(letters[r][c]!==puz.grid[r][c]){revealed[r][c]=true;letters[r][c]=puz.grid[r][c];}
    const el=cellEls[r+","+c]; el.classList.remove("wrong");
    if(revealed[r][c]) el.classList.add("revealed");
    el.querySelector("input").value=letters[r][c];
  }
  save(); finished=true; updateDone(); status("答えを表示しました（青い文字が見た答え）");
});
$("newBtn").addEventListener("click",newPuzzle);
sel.addEventListener("change",newPuzzle);
window.addEventListener("resize",()=>{$("board").style.setProperty("--cs",cellSize()+"px");});

const h=parseHash();
if(h.t&&TOPICS.some(t=>t.id===h.t)&&Number.isFinite(h.s)){sel.value=h.t;load(h.t,h.s);}
else newPuzzle();
})();
</script>
</body>
